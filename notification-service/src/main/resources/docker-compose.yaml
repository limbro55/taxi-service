version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: taxi-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user_admin
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

volumes:
  postgres_data: