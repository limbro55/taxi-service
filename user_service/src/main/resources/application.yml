spring:
  datasource:
    url: jdbc:postgresql://localhost:5431/taxi_user_db
    username: user_admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Меняем на validate, если используем Flyway
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Добавляем, чтобы включить миграции
  flyway:
    enabled: true
    baseline-on-migrate: true